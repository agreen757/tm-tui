name: Tests

on:
  push:
    branches: [ main, develop, concurrent-task-execution ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.23.x', '1.24.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-${{ matrix.go-version }}-
    
    - name: Download dependencies
      run: go mod download
    
    - name: Run tests with coverage
      run: go test -v ./... -coverprofile=coverage.out -covermode=atomic -race
    
    - name: Generate coverage report
      run: |
        go tool cover -func=coverage.out | tail -1
        echo "Coverage report saved to coverage.out"
    
    - name: Verify coverage threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
        echo "Current coverage: ${COVERAGE}%"
        echo "Required threshold: 80%"
        if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
          echo "✓ Coverage meets 80% threshold"
        else
          echo "⚠ Coverage is ${COVERAGE}% (target: 80%)"
        fi
    
    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23.x'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Upload coverage artifact
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.23.x'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.out
  
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23.x'
    
    - name: Run go fmt
      run: |
        gofmt -l .
        test -z "$(gofmt -l .)"
    
    - name: Run go vet
      run: go vet ./...
    
    - name: Run staticcheck
      uses: dominikh/staticcheck-action@v1
      with:
        version: "latest"
